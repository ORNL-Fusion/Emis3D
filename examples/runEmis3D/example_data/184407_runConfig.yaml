# Config file for a basic Emis3D run

# List of folder(s) containing radDists that are independent of injection location
# How the fit is solved: library (the radDist folders below) or parametric (a parametric:
# block fitting models through geometry matrices; see the JET example in the docs)
solver: library

# Bounds of the amplitude a (relative to the data's peak) and the toroidal decay b, both solvers
bounds:
  a: [0.05, 20.0]
  b: [0.0, 10.0]

radDistDirectories_LocIndependent: ['elongatedRing']

# List of folder(s) containing radDists that are dependent of injection location
# The program will combine these to solve for multiple injections
radDistDirectories_LocDependent: [] #['184407_injectionLocation_225']
injectionLocation: 225 # Injection location in degrees
numProcessorsFitting: 7 # Number of processors to use while fitting the radDists to the bolometer data

shot: 184407
tstart: 2100 # Start time of the simultaion, same units as the SXR/bolometer signal
tend: 2100 # End time of the simulation, can be equal to tstart to reconstruct one timestep
dt: 0.3 # Averaging window 
enable_dphi_scaling: True # False = the program will not vary the constant by the scale factor
scale_def: "linear" # Options: "linear", "exponential", "constant"

# Path for each data file relative to the workspace 'measurements' location (see `emis3d paths`)
BOLOMETERS:
  SX90PF:
    dataFileName: '184407/184407_SX90PF_PROCESSED.h5'
    scalingFactor: 5.00 # Multiply the calibrated data by this factor
  SX90MF:
    dataFileName: '184407/184407_SX90MF_PROCESSED.h5'
    scalingFactor: 4.96
  DISRADU:
    dataFileName: '184407/184407_DISRADU_PROCESSED.h5'
    scalingFactor: 1.0
  #SX45F:
  #  dataFileName: '184407/184407_SX45F_PROCESSED.h5'
  #  scalingFactor: 1.0 

# Ranges for TPF and the other derived quantities (all keys optional; on by default).
# calibration: relative 1-sigma uncertainty per camera, e.g. from `emis3d calibrate`
# uncertainty:
#   n_samples: 2000
#   max_candidates: 25
#   calibration:
#     SX90PF: 0.10
#     DISRADU: 0.10
#   n_calibration: 20
