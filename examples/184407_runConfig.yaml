# Emis3D run config: DIII-D shot 184407

# --- What is being analysed
shot: 184407  # Shot number
tokamakName: DIII-D  
injector: SPI135 # Use the injection location from "SPI135" in the machine config file
injectionLocation: 225.0  # Injector toroidal angle [deg]; in Emis3D coordinates. E.g. for DIII-D 360-135 = 225

# --- Times (in the units of the measurement files)
tstart: 2121.07  # First evaluation time
tend: 2121.07  # Last evaluation time; equal to tstart fits one time. For a whole shot, e.g. tend: 2123.0 with Nt: 20
Nt: 1  # Number of evenly spaced times from tstart to tend (ignored when tend = tstart)
dt: 0.1  # Averaging half-width: each channel is averaged over [t - dt, t + dt]

# --- Cameras: dataFileName is relative to the workspace's measurements location (measurements/DIII-D)
BOLOMETERS:
  DISRADU:
    dataFileName: '184407/184407_DISRADU_PROCESSED.h5'  # Processed data file for DISRADU
    scalingFactor: 1.0  # Multiplies the data (cross-calibration correction)
    badChannels: ['DISRADU16']  # Channels to leave out of the fit, by channel name
    error_floor: 0.05
    error_relative: 0.10
  SX90MF:
    dataFileName: '184407/184407_SX90MF_PROCESSED.h5'  # Processed data file for SX90MF
    scalingFactor: 4.96  # Multiplies the data (cross-calibration correction)
    # badChannels: []  # Channels to leave out of the fit, by channel name
  SX90PF:
    dataFileName: '184407/184407_SX90PF_PROCESSED.h5'  # Processed data file for SX90PF
    scalingFactor: 5.00  # Multiplies the data (cross-calibration correction)
    # badChannels: []  # Channels to leave out of the fit, by channel name

# ----- FITTER STUFF BELOW ------ #

# --- How the fit is solved
solver: parametric  # library: fit every radDist in the folders below | parametric: fit each model's parameters through geometry matrices

# --- Bounds of the amplitude and the toroidal decay (both solvers)
bounds:
  a: [0.05, 20.0]  # Amplitude, relative to the data's peak (1: the model's peak equals the data's)
  b: [0.0, 10.0]  # Toroidal decay: exponential per rad^2 (default [0, 10]); linear per rad (default [0.01, 0.4])

# --- solver: library -- candidate radiation distributions (folders relative to <raddists>/<machine>)
radDistDirectories_LocIndependent: []  # Axisymmetric shapes (rings, tubes, shells, simulations)
radDistDirectories_LocDependent: []  # Helical radDists tied to an injector

# --- solver: parametric -- models fitted directly through geometry matrices (no radDist library)
parametric:
  models: [band_spray]  #  band_spot Models and composites to fit and compare by AIC. Models: helical, helical_psi, ring, shell, tube, asymshell; composites: defined below
  matrices: [low, medium]  # Geometry matrices, coarsest first (global search on the first, polish on the last); emis3d build-matrix <machine> --resolution <name>
  equilibrium: g184407.02100  # g-file in equilibria/<machine>
  transits: 2  # helical: toroidal turns followed in each direction from the injector plane
  substeps: 2  # helical: field lines traced per source-pixel edge (2: four per pixel); the mapping is built once and cached
  maxiter: 60  # Generations of the global search (more: slower, more thorough; composites have more parameters, so more helps)
  popsize: 12  # Population of the global search, per free parameter 
  seed: 0  # Random seed of the global search, so a run can be repeated exactly
  bounds:  # Search range of every model parameter; a fit landing on a bound is flagged ("AT BOUNDS")
    ring:  # An elongated Gaussian ring
      startR: [0.8, 2.1]  # Centre R [m]
      startZ: [-1.1, 1.0]  # Centre z [m]
      sigma_R: [0.01, 1.5]  # Width along its first axis [m]
      sigma_z: [0.01, 1.5]  # Width along its second axis [m]
      rotationAngle: [0.0, 90.0]  # Tilt [deg]; 0-90 covers every orientation, with both widths free
    tube:  # A uniform rectangular tube
      startR: [0.8, 2.1]  # Centre R [m]
      startZ: [-1.1, 1.0]  # Centre z [m]
      dR: [0.02, 1.0]  # Radial half-width [m]: the tube spans startR +- dR
      dz: [0.02, 1.5]  # Vertical half-height [m]: the tube spans startZ +- dz
    shell:  # A shell of flux surfaces (an edge mantle, or a hollow profile)
      psi_center: [0.1, 1.15]  # Centre in normalized flux psi_N (1 is the last closed flux surface)
      psi_width: [0.02, 0.5]  # Gaussian width in psi_N
    asymshell:  # A shell brighter on one poloidal side (a crescent)
      psi_center: [0.1, 1.15]  # Centre in psi_N
      psi_width: [0.02, 0.5]  # Gaussian width in psi_N
      asym_amp: [0.0, 1.0]  # Asymmetry: 0 symmetric, 1 fully one-sided (zero on the far side)
      asym_angle: [-180.0, 180.0]  # Poloidal angle of the bright side about the magnetic axis [deg]: 0 outboard, 90 top, 180 inboard
    helical:  # A Gaussian source on the injector plane carried along field lines, fading as exp(-decay dphi^2)
      startR: [0.8, 2.1]  # Source centre R [m]
      startZ: [-1.1, 1.0]  # Source centre z [m]
      sigma_R: [0.02, 1.2]  # Source width in R [m]
      sigma_z: [0.02, 1.2]  # Source width in z [m]
    helical_psi:
      psi_center: [0.1, 1.1] # which surface
      psi_width: [0.01, 0.4] # thickness across the surface
      theta_center: [-180.0, 180.0] # 0 = outboard, 90 = top, 180 = inboard
      theta_width: [3.0, 180.0]

  composites:  # Several structures fitted together; list a composite's name in models to fit it
    band_spot:
      components: 
        - {model: helical_psi, name: band}
        - {model: helical, name: spot, bounds: {sigma_R: [0.02, 0.3], sigma_z: [0.02, 0.3]}}
      shared_toroidal: False  # True: one toroidal peak location and decay for both; False: each its own
    band_spray:
      components: 
        - {model: helical_psi, name: band}
        - {model: spray_spot, name: spot, bounds: {sigma_R: [0.02, 0.3], sigma_z: [0.02, 0.3]}}
      shared_toroidal: False  # True: one toroidal peak location and decay for both; False: each its own
    two_bands:
      components: 
        - {model: helical_psi, name: band1, bounds: {theta_width: [20, 180]}}
        - {model: helical_psi, name: band2, bounds: {theta_width: [3, 30]}}
      shared_toroidal: False  # True: one toroidal peak location and decay for both; False: each its own

  # Each helical structure's decay takes the top-level bounds.b; its source plane, peak_shift_max_degrees
  # fixed:  # Hold any model parameter at a value instead of fitting it
  #   ring: {rotationAngle: 0.0}
  # supersample: 2  # Sub-samples per voxel edge for narrow structures (default: automatic)

# --- Toroidal shape of the radiation
scale_def: "exponential"  # Toroidal shape of axisymmetric models (ring, tube, shells): linear or exponential
#   The helical models fit their own decay along the field, so with only helical models (and composites of them)
toroidal_floor: True # add a constant offset to the toroidal scaling: a * exp(-b dphi^2) + c, with c >= 0
enable_dphi_scaling: True  # Library solver only
vary_peak_rad_location: True  # False puts the radiation peak at the injector; True fits its toroidal location (a helical source plane)
peak_shift_max_degrees: 90.0  # How far a fitted peak may move from the injector [deg]; with two components each moving freely,
#   a narrower range (e.g. 90) keeps one from parking where no camera can see it
helical_endpoint_weight: 0  # Library solver only

# --- Channel errors: sigma^2 = (error_floor * peak)^2 + (error_relative * signal)^2
error_definition: "floor_relative"  # Error model: floor_relative (recommended), constant, poisson or exponential
error_floor: 0.05  # Additive error, as a fraction of the peak signal (keeps near-zero channels from dominating)
error_relative: 0.05  # Relative error, as a fraction of each channel's signal (calibration uncertainty)
# noise_window: [50.90, 50.94]  # Optional [t_start, t_end] quiet period; raises each channel's floor to its measured noise

# --- Fitting
fit_method: "differential_evolution"  # Library solver only (the parametric solver always searches globally, then polishes)
numProcessorsFitting: 7  # Library solver only

# --- Ranges for TPF and other derived quantities (on by default; all keys optional)
uncertainty:
  n_samples: 2000  # Parameter samples used for the ranges
  max_candidates: 25  # Library solver only (parametric ranges come from the fit's own covariance)
  # calibration:  # Relative 1-sigma calibration uncertainty per camera (`emis3d calibrate` prints this block)
  #   KB5V: 0.05
  #   KB5H: 0.05

