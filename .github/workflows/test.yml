name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: pip install -e ".[test]"

      - name: Smoke-test imports
        run: python -c "import cherab; import raysect; import emis3d"

      - name: Run unit tests
        run: python -m pytest tests/ -v --cov=emis3d --cov-report=term-missing

      # Ray-tracing tests on the built-in MOCK machine, including the end-to-end
      # self-test (about 15 s); deselected from the default run by the cherab marker
      - name: Run ray-tracing tests
        env:
          MPLBACKEND: Agg
        run: python -m pytest tests/ -v -m cherab
