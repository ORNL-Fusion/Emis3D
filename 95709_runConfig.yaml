# Emis3D run config: JET shot 95709
# Keys and defaults are defined in src/emis3d/run_config.py; unknown keys are an error.
# Paths are relative to the workspace locations shown by `emis3d paths --config <this file>`.
# Check before a long run: emis3d check <this file>

# --- What is being analysed
shot: 95709  # Shot number; also used in result file names
tokamakName: JET  # Machine; selects machines/JET, measurements/JET, raddists/JET and equilibria/JET
injectionLocation: 11  # Injector toroidal angle [deg]; must match the radDists' injectionLocation

# --- How the fit is solved
solver: parametric  # library: fit every radDist in the folders below | parametric: fit each model's parameters through geometry matrices

# --- Bounds of the amplitude and the toroidal decay (both solvers)
bounds:
  a: [0.05, 20.0]  # Amplitude, relative to the data's peak (1: the model's peak equals the data's)
  b: [0.0, 10.0]  # Toroidal decay: exponential per rad^2 (default [0, 10]); linear per rad (default [0.01, 0.4])

# --- solver: library -- candidate radiation distributions (folders relative to <raddists>/JET)
radDistDirectories_LocIndependent: ["95709/elongatedRing"]  # Axisymmetric shapes (rings, tubes, shells, simulations)
radDistDirectories_LocDependent: []  # Helical radDists tied to an injector

# --- solver: parametric -- models fitted directly through geometry matrices (no radDist library)
parametric:
  models: [helical, asymshell, ring]  # Each is fitted and they are ranked by AIC; the best is used for the profile, TPF and figure
  # Models: helical (early: a source at the injector spreading along field lines), asymshell (thermal quench:
  # a poloidally asymmetric edge shell), ring (current quench), shell (symmetric shell), tube
  matrices: [low, medium]  # Geometry matrices, coarsest first (global search on the first, polish on the last); emis3d build-matrix JET --resolution <name>
  equilibrium: g_JET_p95707_t50.544800  # g-file in equilibria/JET; needed by the shell, asymshell and helical models
  transits: 1  # helical: toroidal turns followed in each direction from the injector plane
  substeps: 2  # helical: field lines traced per source-pixel edge (2: four per pixel); the mapping is built once and cached
  maxiter: 60  # Generations of the global search (more: slower, more thorough)
  popsize: 12  # Population of the global search, per free parameter
  seed: 0  # Random seed of the global search, so a run can be repeated exactly
  bounds:  # Search range of every model parameter; a fit landing on a bound is flagged ("AT BOUNDS")
    ring:  # An elongated Gaussian ring
      startR: [1.9, 3.9]  # Centre R [m]
      startZ: [-1.5, 1.8]  # Centre z [m]
      sigma_R: [0.03, 1.5]  # Width along its first axis [m]
      sigma_z: [0.03, 1.5]  # Width along its second axis [m]
      rotationAngle: [0.0, 90.0]  # Tilt [deg]; 0-90 covers every orientation, with both widths free
    tube:  # A uniform rectangular tube
      startR: [1.9, 3.9]  # Centre R [m]
      startZ: [-1.5, 1.8]  # Centre z [m]
      dR: [0.02, 1.0]  # Radial half-width [m]: the tube spans startR +- dR
      dz: [0.02, 1.5]  # Vertical half-height [m]: the tube spans startZ +- dz
    shell:  # A shell of flux surfaces (an edge mantle, or a hollow profile)
      psi_center: [0.1, 1.15]  # Centre in normalized flux psi_N (1 is the last closed flux surface)
      psi_width: [0.02, 0.5]  # Gaussian width in psi_N
    asymshell:  # A shell brighter on one poloidal side (a crescent)
      psi_center: [0.1, 1.15]  # Centre in psi_N
      psi_width: [0.02, 0.5]  # Gaussian width in psi_N
      asym_amp: [0.0, 1.0]  # Asymmetry: 0 symmetric, 1 fully one-sided (zero on the far side)
      asym_angle: [-180.0, 180.0]  # Poloidal angle of the bright side about the magnetic axis [deg]: 0 outboard, 90 top, 180 inboard
    helical:  # A Gaussian source on the injector plane carried along field lines, fading as exp(-decay dphi^2)
      startR: [1.9, 3.9]  # Source centre R [m]
      startZ: [-1.5, 1.8]  # Source centre z [m]
      sigma_R: [0.02, 0.5]  # Source width in R [m]
      sigma_z: [0.02, 0.5]  # Source width in z [m]
      # decay takes the top-level bounds.b
  # fixed:  # Hold any model parameter at a value instead of fitting it
  #   ring: {rotationAngle: 0.0}
  # supersample: 2  # Sub-samples per voxel edge for narrow structures (default: automatic)

# --- Evaluation times (in the units of the measurement files): Nt evenly spaced
# times from tstart to tend, inclusive; _perform_fits() and _plot_bestFit() loop over them
tstart: 50.9543  # First evaluation time
tend: 50.9543  # Last evaluation time; equal to tstart gives a single time (Nt is then ignored)
Nt: 10  # Number of evaluation times from tstart to tend
dt: 0.001  # Averaging half-width: each channel is averaged over [t - dt, t + dt]

# --- Toroidal shape of the radiation
scale_def: "exponential"  # Fall-off away from the injector: exponential, linear or constant (library also: step)
enable_dphi_scaling: True  # Library solver: fit the fall-off rate b; False fixes it and fits only the amplitude
vary_peak_rad_location: False  # Library solver: True fits the peak's toroidal location instead of the injector's
peak_shift_max_degrees: 180.0  # How far a fitted peak may move from the injector [deg] (with vary_peak_rad_location)
helical_endpoint_weight: 0  # Ties helical clockwise/counterclockwise endpoints together; 0 = off (helical radDists only)

# --- Channel errors: sigma^2 = (error_floor * peak)^2 + (error_relative * signal)^2
error_definition: "floor_relative"  # Error model: floor_relative (recommended), constant, poisson or exponential
error_floor: 0.05  # Additive error, as a fraction of the peak signal (keeps near-zero channels from dominating)
error_relative: 0.05  # Relative error, as a fraction of each channel's signal (calibration uncertainty)
# noise_window: [50.90, 50.94]  # Optional [t_start, t_end] quiet period; raises each channel's floor to its measured noise

# --- Fitting (library solver)
fit_method: "least_squares"  # least_squares (fast, local) or differential_evolution (global, slower)
numProcessorsFitting: 7  # Parallel fits of the radDists

# --- Ranges for TPF and other derived quantities (on by default; all keys optional)
uncertainty:
  n_samples: 2000  # Parameter samples used for the ranges
  max_candidates: 25  # Best radDists considered for the model uncertainty
  # calibration:  # Relative 1-sigma calibration uncertainty per camera (`emis3d calibrate` prints this block)
  #   KB5V: 0.05
  #   KB5H: 0.05

# --- Cameras: dataFileName is relative to the workspace's measurements location (measurements/JET)
BOLOMETERS:
  KB5V:
    dataFileName: '95709/95709_KB5V_CALIBRATED.h5'  # Processed data file for the vertical KB5 camera
    scalingFactor: 1.0  # Multiplies the data (cross-calibration correction)
    # badChannels: []  # Channels to leave out of the fit, by channel name
  KB5H:
    dataFileName: '95709/95709_KB5H_CALIBRATED.h5'  # Processed data file for the horizontal KB5 camera
    scalingFactor: 1.0  # Multiplies the data (cross-calibration correction)
    # badChannels: []  # Channels to leave out of the fit, by channel name
