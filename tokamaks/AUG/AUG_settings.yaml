# Config file for the ASDEX Upgrade tokamak


# --- Machine parameters
MACHINE:
  device: 'AUG'
  volume:  30 # m3
  majorRadius: 1.65 # m
  minorRadius: 0.5 # m
  wallFileName: 'aug_Limiter_RZ.txt'
  numInjectors: 1 # number of dismit injectors
  PFC_STL_PATH: 'AUG_CAD.stl' # stl CAD file of the tokamak
  STL_UNITS: 'm'


# --- SXR/Bolometer parameter filenames
