# SX45F_DOWN configuration file

NAME: "SX45F_DOWN"
GROUP_NAME: "SX45F"
NUM_CHANNELS: 7
TYPE: "planar"
CHANNEL_TAGS: ['SX45F01', 'SX45F02', 'SX45F03','SX45F04', 'SX45F05',
               'SX45F06', 'SX45F07']

BUILD_TYPE: "FROM PRIMITIVES" # Build the camera from primitives, not using a CAD file
SLIT_WIDTH: 0.0036  # 3600 um slit (effective circular) 2.2 by 4.7 mm slit
SLIT_HEIGHT: 0.0036 # 3600 um slit (effective circular)
FOIL_WIDTH: 0.002  # width of the diode
FOIL_HEIGHT: 0.005  # height of the diode
FOIL_CORNER_CURVATURE: 0.0005
SLIT_SENSOR_SEPARATION: 0.0288  # 2.6 cm between the slit and the diode array
FOIL_SEPARATION: 0.00212  # 2.12 mm between diodes
FOIL_POSITIONS: [5.5, 3.5, 1.5, -0.5, -2.5, -4.5, -6.5]

#[2.5, 1.3, -1.2, -3.0, -4.6, -6.3, -9.0] # Foil shift relative to the center of the sensor
# This is where the center of the diode is, example: 0.5 * FOIL_SEPARATION

# Location in Emis3D = 360 - 45 = 315
CAMERA_POSITION_R_Z_PHI: [2.304, 0.731, 315.0] # R, z position of the camera
# NOTE: Phi is in degrees in Emis3D coordinates = 360 - DIII-D coordinates
CAMERA_ROTATION: 154 # Rotate the camera this amount, in degrees, towards R=0, z=0
CAMERA_DOWNWARD_FACING: True # True for -z cameras, False for +z cameras (RM on DIII-D)

# Optional stuff below!

# Chord information, testing/sxr_chords.py uses this to make sure that everything is correct
r0:   [2.304, 2.304, 2.304, 2.304, 2.304, 2.304, 2.304]
rf:   [2.19,  1.98,   1.53, 1.12,   1.01,  1.01,  1.01]
z0:   [0.731, 0.731, 0.731, 0.731, 0.731, 0.731, 0.731]
zf:   [-0.83, -1.06, -1.24, -1.34, -1.01, -0.65, -0.28]

# Adding this will save a lot of time while creating radDists, since the program will use
# these instead of calculating them 
ETENDUE: [1.15339841e-07, 1.37403513e-07, 1.52508610e-07, 1.55827531e-07,
       1.46181136e-07, 1.26878508e-07, 1.03457440e-07]
